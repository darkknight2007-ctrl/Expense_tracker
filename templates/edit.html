{% extends "base.html" %}
{% block title %}Edit Expense – ExpenseTracker{% endblock %}

{% block content %}
<section class="page-header">
  <h1>Edit Expense</h1>
  <a class="btn btn-sm btn-edit" href="{{ url_for('index') }}">← Back</a>
</section>

<div class="card" style="max-width: 560px;">
  <form method="post" action="{{ url_for('edit_expense', expense_id=expense['id']) }}">
    <div class="form-grid">
      <div class="form-group">
        <label for="amount">Amount ($)</label>
        <input id="amount" name="amount" type="number" step="0.01" min="0.01"
               value="{{ expense['amount'] }}" required />
      </div>
      <div class="form-group">
        <label for="category">Category</label>
        <select id="category" name="category" required>
          {% for cat in categories %}
          <option value="{{ cat }}" {% if cat == expense['category'] %}selected{% endif %}>
            {{ cat }}
          </option>
          {% endfor %}
        </select>
      </div>
      <div class="form-group">
        <label for="date">Date</label>
        <input id="date" name="date" type="date"
               value="{{ expense['date'] }}" required />
      </div>
      <div class="form-group">
        <label for="note">Note (optional)</label>
        <input id="note" name="note" type="text"
               value="{{ expense['note'] or '' }}" placeholder="e.g. Lunch at cafe" />
      </div>
    </div>
    <div class="form-actions" style="margin-top:1.25rem;">
      <button class="btn btn-primary" type="submit">Save Changes</button>
      <a class="btn btn-sm btn-delete" href="{{ url_for('index') }}">Cancel</a>
    </div>
  </form>
</div>
{% endblock %}
